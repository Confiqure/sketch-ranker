version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            # Next 16 requires Node >= 20; prefer 22, fall back gracefully.
            - nvm use 22 || nvm use 20 || echo "using default node $(node -v)"
            - echo "DATABASE_URL=${DATABASE_URL}" > .env
            - echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" >> .env
            - echo "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}" >> .env
            - echo "NEXTAUTH_SECRET=${NEXTAUTH_SECRET}" >> .env
            - echo "NEXTAUTH_URL=${NEXTAUTH_URL}" >> .env
            - echo "ADMIN_EMAILS=${ADMIN_EMAILS}" >> .env
            - npm ci
            - npx prisma generate
        build:
          commands:
            - npm run build
        postBuild:
          commands:
            - npx prisma migrate deploy
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
